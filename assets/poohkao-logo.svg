<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Poohkao.platforms logo" xmlns:c2pa="http://c2pa.org/manifest"><style>.oo{fill:#3f7d6e}@media (prefers-color-scheme:dark){.oo{fill:#7fc4b2}}@import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&amp;display=swap");.rg{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.4s .1s cubic-bezier(.4,0,.2,1) forwards}
